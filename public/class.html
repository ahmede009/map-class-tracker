<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class MAP Performance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --ais-blue: #00529b; 
            --ais-yellow: #ffc72c; 
            --bg: #f8fafc; 
            --text-main: #0f172a; 
            --text-muted: #64748b;
            --card-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
        }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; color: var(--text-main); -webkit-font-smoothing: antialiased; }
        
        .header { background: linear-gradient(135deg, #003d73 0%, var(--ais-blue) 100%); color: white; padding: 1.5rem 1rem; border-bottom: 4px solid var(--ais-yellow); }
        .header-content { display: flex; flex-direction: column; align-items: center; gap: 15px; max-width: 1000px; margin: 0 auto; position: relative; }
        .header-logo { height: 50px; object-fit: contain; }
        .header h1 { margin: 0; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; text-align: center; line-height: 1.2; z-index: 2; }
        .print-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; white-space: nowrap; }
        .print-btn:hover { background: white; color: var(--ais-blue); }

        .container { max-width: 900px; margin: 20px auto 40px; padding: 0 15px; }
        
        .tabs-container { background: white; padding: 8px; border-radius: 16px; box-shadow: var(--card-shadow); margin-bottom: 24px; }
        .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn { flex: 1; background: transparent; border: none; padding: 12px 24px; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.95rem; color: var(--text-muted); transition: all 0.2s ease; white-space: nowrap; }
        .tab-btn:hover { background: #f1f5f9; color: var(--text-main); }
        .tab-btn.active { background: var(--ais-blue); color: white; box-shadow: 0 4px 12px rgba(0, 82, 155, 0.2); }
        
        .term-tabs { margin-bottom: 24px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
        .term-btn { background: white; border: 1.5px solid #e2e8f0; padding: 8px 20px; border-radius: 30px; cursor: pointer; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); transition: all 0.2s ease; }
        .term-btn:hover { border-color: #cbd5e1; transform: translateY(-1px); }
        .term-btn.active { border-color: var(--ais-yellow); background: #fffcf2; color: var(--ais-blue); box-shadow: 0 2px 8px rgba(255, 199, 44, 0.15); }
        
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: var(--card-shadow); margin-bottom: 24px; border: 1px solid #f1f5f9; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 30px; }
        
        .stat-box { background: #ffffff; padding: 24px; border-radius: 16px; border: 1px solid #e2e8f0; position: relative; overflow: hidden; transition: transform 0.2s ease; }
        .stat-box:hover { transform: translateY(-2px); box-shadow: var(--card-shadow); }
        .stat-box::before { content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 4px; background: var(--ais-yellow); }
        
        .stat-label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
        .stat-value { font-size: 2.2rem; font-weight: 800; color: var(--text-main); margin: 8px 0; line-height: 1; }
        .stat-subtext { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
        
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        .positive-badge { background: #dcfce7; color: #166534; }
        .negative-badge { background: #fee2e2; color: #991b1b; }
        .positive { color: #166534; }
        .negative { color: #991b1b; }
        .neutral { color: var(--text-muted); font-size: 1.5rem; }

        .chart-wrapper { position: relative; height: 300px; width: 100%; }

        @media (min-width: 768px) {
            .header-content { flex-direction: row; justify-content: space-between; }
            .header h1 { position: absolute; left: 50%; transform: translateX(-50%); font-size: 2.2rem; width: 100%; pointer-events: none; }
            .header-logo { height: 60px; }
            .container { margin-top: -20px; padding: 0 20px; }
            .card { padding: 30px; }
            .chart-wrapper { height: 400px; }
        }

        @media print {
            body { background: white; color: black; }
            .header { background: none; color: black; border-bottom: 2px solid black; padding: 10px 0; margin-bottom: 20px; }
            .header-content { flex-direction: row; justify-content: flex-start; gap: 20px; }
            .header h1 { position: static; transform: none; color: black; font-size: 1.8rem; text-align: left; }
            .print-btn, .tabs-container, .term-tabs { display: none !important; }
            .container { margin: 0; padding: 0; max-width: 100%; }
            .card, .stat-box { border: 1px solid #ccc; box-shadow: none; break-inside: avoid; }
            .chart-wrapper { height: 300px !important; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <img src="/logo.png" alt="School Logo" class="header-logo" onerror="this.style.display='none'">
            <h1 id="className">Loading...</h1>
            <button class="print-btn" onclick="window.print()">🖨 Print Report</button>
        </div>
    </div>
    
    <div class="container">
        <div class="tabs-container">
            <div class="tabs" id="subjectTabs"></div>
        </div>
        <div class="term-tabs" id="termTabs"></div>
        <div id="content"></div>
    </div>

    <script>
        const uuid = new URLSearchParams(window.location.search).get('id');
        let classData = null;
        let currentSubjectIndex = 0;
        let currentTerm = 'All';
        let chartInstance = null;

        async function init() {
            if (!uuid) return document.getElementById('content').innerHTML = '<div class="card"><h3 style="color:red; text-align:center;">Invalid Access Link.</h3></div>';
            try {
                const res = await fetch(`/api/classes/${uuid}`);
                if (!res.ok) throw new Error('Not Found');
                classData = await res.json();
                
                document.getElementById('className').textContent = `Class ${classData.classId} Dashboard`;
                renderSubjectTabs();
                if (classData.subjects.length > 0) updateView(0, 'All');
            } catch (err) {
                document.getElementById('content').innerHTML = '<div class="card"><h3 style="color:red; text-align:center;">Secure link expired or invalid.</h3></div>';
            }
        }

        function renderSubjectTabs() {
            const html = classData.subjects.map((sub, i) => 
                `<button class="tab-btn ${i === currentSubjectIndex ? 'active' : ''}" onclick="updateView(${i}, 'All')">${sub.name}</button>`
            ).join('');
            document.getElementById('subjectTabs').innerHTML = html;
        }

        function renderTermTabs(subject) {
            let html = `<button class="term-btn ${currentTerm === 'All' ? 'active' : ''}" onclick="updateView(${currentSubjectIndex}, 'All')">All Terms</button>`;
            subject.mapScores.forEach(score => {
                const isActive = currentTerm === score.term ? 'active' : '';
                html += `<button class="term-btn ${isActive}" onclick="updateView(${currentSubjectIndex}, '${score.term}')">${score.term}</button>`;
            });
            document.getElementById('termTabs').innerHTML = html;
        }

        function updateView(subjectIndex, term) {
            currentSubjectIndex = subjectIndex;
            currentTerm = term;
            const subject = classData.subjects[currentSubjectIndex];
            
            renderSubjectTabs();
            renderTermTabs(subject);
            
            let statsHtml = '';
            let showChart = false;
            let chartData = [];

            if (currentTerm === 'All') {
                const latest = subject.mapScores[subject.mapScores.length - 1];
                let growthHtml = '';
                
                if (subject.mapScores.length > 1) {
                    const first = subject.mapScores[0];
                    const growth = latest.ritScore - first.ritScore;
                    const sign = growth > 0 ? '+' : '';
                    const colorClass = growth >= 0 ? 'positive' : 'negative';
                    const badgeClass = growth >= 0 ? 'positive-badge' : 'negative-badge';
                    
                    growthHtml = `<div class="stat-value ${colorClass}">${sign}${growth}</div>
                                  <div class="stat-subtext"><span class="badge ${badgeClass}">${sign}${growth} pts</span> Since ${first.term}</div>`;
                } else {
                    growthHtml = `<div class="stat-value neutral">N/A</div>
                                  <div class="stat-subtext">Cannot calculate growth yet.</div>`;
                }

                statsHtml = `
                    <div class="stat-box">
                        <div class="stat-label">Latest Average (${latest.term})</div>
                        <div class="stat-value">${latest.ritScore}</div>
                        <div class="stat-subtext">Target Norm: <strong>${latest.nationalNorm}</strong></div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Total Class Growth</div>
                        ${growthHtml}
                    </div>
                `;
                showChart = true;
                chartData = subject.mapScores;

            } else {
                const termData = subject.mapScores.find(s => s.term === currentTerm);
                const diff = termData.ritScore - termData.nationalNorm;
                const sign = diff > 0 ? '+' : '';
                const colorClass = diff >= 0 ? 'positive' : 'negative';
                const badgeClass = diff >= 0 ? 'positive-badge' : 'negative-badge';
                const statusText = diff >= 0 ? 'Above Target' : 'Below Target';

                statsHtml = `
                    <div class="stat-box">
                        <div class="stat-label">${termData.term} Class Average</div>
                        <div class="stat-value">${termData.ritScore}</div>
                        <div class="stat-subtext">Score locked</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">Performance vs. Target</div>
                        <div class="stat-value ${colorClass}">${sign}${diff}</div>
                        <div class="stat-subtext"><span class="badge ${badgeClass}">${statusText}</span></div>
                    </div>
                `;
            }

            document.getElementById('content').innerHTML = `
                <div class="stats-grid">${statsHtml}</div>
                ${showChart ? `
                <div class="card">
                    <h3 style="margin-top:0; color:var(--text-main); font-weight:700;">Performance Trajectory</h3>
                    <div class="chart-wrapper">
                        <canvas id="mapChart"></canvas>
                    </div>
                </div>` : ''}
            `;

            if (chartInstance) chartInstance.destroy();
            
            if (showChart) {
                chartInstance = new Chart(document.getElementById('mapChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: chartData.map(s => s.term),
                        datasets: [
                            { label: 'Class Average', data: chartData.map(s => s.ritScore), borderColor: '#00529b', backgroundColor: 'rgba(0, 82, 155, 0.1)', borderWidth: 3, fill: true, tension: 0.4, pointBackgroundColor: '#ffffff', pointBorderColor: '#00529b', pointBorderWidth: 2, pointRadius: 5, pointHoverRadius: 7 },
                            { label: 'Target Norm', data: chartData.map(s => s.nationalNorm), borderColor: '#ffc72c', borderDash: [6, 6], borderWidth: 2, tension: 0.4, pointRadius: 0 }
                        ]
                    },
                    options: { 
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { intersect: false, mode: 'index' },
                        plugins: { tooltip: { backgroundColor: '#0f172a', padding: 12, titleFont: { size: 14, family: 'Inter' }, bodyFont: { size: 13, family: 'Inter' } } },
                        scales: { y: { grid: { borderDash: [4, 4] }, suggestedMin: 180, suggestedMax: 260 }, x: { grid: { display: false } } }
                    }
                });
            }
        }
        init();
    </script>
</body>
</html>
